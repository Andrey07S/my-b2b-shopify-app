# Render Blueprint — staging only
# New → Blueprint → connect this repo, then put the service URL into shopify.app.toml

services:
  - type: web
    name: my-b2b-smart-app
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_customers,read_discounts,read_orders,read_products,read_validations,write_cart_transforms,write_customers,write_discounts,write_validations
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: my-b2b-smart-app-db
          property: connectionString

databases:
  - name: my-b2b-smart-app-db
    plan: basic-256mb
